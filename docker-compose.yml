services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geofencing_db
    environment:
      POSTGRES_USER: geofencing
      POSTGRES_PASSWORD: geofencing
      POSTGRES_DB: geofencing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofencing"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: geofencing_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://geofencing:geofencing@db:5432/geofencing
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: